plugin:
  name: custom-data-type-gnd
  version: 1.5
  url: https://github.com/programmfabrik/fylr-plugin-custom-data-type-gnd
  displayname:
    de-DE: gnd-Verknüpfung
    en-US: gnd-Referencing
  info:
    de-DE: |
      Ergänzt fylr um einen Feldtyp (Custom Data Type), mit dem sich Datensätze mit Einträgen der [Gemeinsamen Normdatei (GND)](https://de.wikipedia.org/wiki/Gemeinsame_Normdatei) verknüpfen lassen. Redakteure suchen und wählen Personen, Körperschaften, Schlagwörter, Geografika, Werke und Ereignisse direkt im Maskenfeld.

      - Autocomplete-Vorschläge über den Suggest-Dienst des GBV
      - Optionale Zusatzinformationen beim Überfahren via EntityFacts-API der Deutschen Nationalbibliothek
      - Speicherung von GeoJSON-Koordinaten für Orte und Geografika
      - Nächtlicher Abgleich verknüpfter Einträge über lobid.org/gnd
    en-US: |
      Adds a custom data type for linking records to entities of the German [Integrated Authority File (GND)](https://en.wikipedia.org/wiki/Integrated_Authority_File). Editors search and pick persons, corporate bodies, subject headings, places, works, and events directly in a mask field.

      - Autocomplete suggestions from the GBV suggest service
      - Optional extra details on hover via the Deutsche Nationalbibliothek EntityFacts API
      - Stores GeoJSON coordinates for places and geographic names
      - Nightly synchronization of linked entries via lobid.org/gnd
  server:
    api-version:
      require: 1
  l10n: l10n/customDataTypeGND.csv
  webfrontend:
    url: customDataTypeGND.js
    css: customDataTypeGND.css
    dependencies:
      - commons-library

base_url_prefix: "webfrontend"
custom_types:
  gnd:
    mapping:
      conceptName:
        type: text
      conceptURI:
        type: text
        skipTerms: true
      conceptAncestors:
        type: text
        skipTerms: true
      conceptGeoJSON:
        type: geo_json
        skipTerms: true
      facetTerm:
        type: text_l10n
        skipTerms: true
    config:
      schema:
        - name: add_differentiatedpersons
          parameters:
            value:
              type: bool
        - name: add_coorporates
          parameters:
            value:
              type: bool
        - name: add_geographicplaces
          parameters:
            value:
              type: bool
        - name: add_subjects
          parameters:
            value:
              type: bool
        - name: add_works
          parameters:
            value:
              type: bool
        - name: add_conferenceorevent
          parameters:
            value:
              type: bool
        - name: exact_types
          parameters:
            value:
              type: select
              options: ["ALLE", "SubjectHeadingSensoStricto", "HistoricSingleEventOrEra", "GroupOfPersons", "CharactersOrMorphemes", "MeansOfTransportWithIndividual_name", "FictiveTerm", "NomenclatureInBiologyOrChemistry", "ProductNameOrBrandName", "SoftwareProduct", "Language", "EthnographicName", "MeansOfTransportWithIndividualName", "ReligiousTerritory", "NaturalGeographicUnit", "TerritorialCorporateBodyOrAdministrativeUnit", "FictivePlace", "BuildingOrMemorial", "Country", "AdministrativeUnit", "ExtraterrestrialTerritory", "MemberState", "WayBorderOrLine", "NameOfSmallGeographicUnitLyingWithinAnotherGeographicUnit", "FictiveCorporateBody", "OrganOfCorporateBody", "ProjectOrProgram", "Pseudonym", "LiteraryOrLegendaryCharacter", "Spirits", "RoyalOrMemberOfARoyalHouse", "CollectivePseudonym", "Gods"]
      mask:
        - name: editor_display
          parameters:
            value:
              type: select
              options: ["default", "condensed"]
    update:
      plugin_user:
        reference: system:root
      exec:
        service: "node"
        commands:
          - prog: "node"
            stdin:
              type: body
            stdout:
              type: body
            args:
              - type: "value"
                value: "%_exec.pluginDir%/updater/gndUpdater.js"
              - type: "value"
                value: "%info.json%"
      timeout: 60
      batch_size: 1
      expires_days: 1

base_config:
  - name: update_gnd
    group: update_custom_data_type
    parameters:
      restrict_time:
        type: bool
        default: false
        position: 0
      from_time:
        type: int
        default: 19
        min: 0
        max: 24
        position: 1
      to_time:
        type: int
        default: 4
        min: 0
        max: 24
        position: 2
      default_language:
        type: text
        default: 'de'
        position: 3
      custom_expires_days:
        type: int
        min: 1
        default: 1
        position: 4
  - name: slack_channel
    group: slack_notification
    parameters:
      slack_webhook_url:
        type: text
        position: 0
      slack_cooldown_minutes:
        type: int
        default: 60
        position: 1
  - name: mapbox_gnd
    group: mapbox_update_custom_data_type
    parameters:
      mapbox_api_key:
        type: text
        position: 0
  - name: fulltext_gnd
    group: include_in_fulltext_search
    parameters:
      id:
        type: bool
        default: true
        position: 1
      gndIdentifier:
        type: bool
        default: true
        position: 2
      preferredName:
        type: bool
        default: true
        position: 3
      variantName:
        type: bool
        default: true
        position: 4
      completeName:
        type: bool
        default: true
        position: 5
      biographicalOrHistoricalInformation:
        type: bool
        default: true
        position: 6
      dateOfEstablishment:
        type: bool
        default: true
        position: 7
      dateOfBirth:
        type: bool
        default: true
        position: 8
      dateOfProduction:
        type: bool
        default: true
        position: 9
      dateOfDeath:
        type: bool
